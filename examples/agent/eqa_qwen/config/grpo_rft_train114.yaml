# GRPO RFT after SFT cold-start: initialize the policy from the SFT checkpoint
# (train114) and reinforce on the 114 HM-EQA train questions.
#
# Inherits the verified 8-card Megatron GRPO config and overrides only:
#   - the init policy  -> the SFT HF export (rollout + HF->Megatron both use it)
#   - max_turns 6 -> 20  (the SFT policy submits ~turn 18; 6 would truncate every
#                         rollout to budget_exhausted, defeating the cold-start)
#   - the dataset -> the 114 train questions in {prompt, solutions} form
#   - a real (small) training horizon + checkpointing
#
# Launch (in the rlinf-eqa container; Ray restarted with NVLS disabled — see
# code-doc/0528 §BREAKTHROUGH):
#   bash examples/agent/eqa_qwen/run_train.sh grpo_rft_train114
defaults:
  - train_qwen25vl_7b_8gpu_megatron


runner:
  experiment_name: eqa-grpo-rft-train114
  output_dir: /data/hm_eqa/grpo_rft_train114
  max_steps: 20
  save_interval: 10
  # 0 disables validation entirely (agent_runner ignores run_val anyway) and
  # skips the `save_interval % val_check_interval == 0` assert in check_progress.
  val_check_interval: 0


data:
  train_data_paths: ["/data/hm_eqa/train_rl.jsonl"]


agentloop:
  # SFT policy explores ~3 objects then submits (~18 turns); give it room.
  max_turns: 20
  trace_dump_dir: /data/hm_eqa/grpo_rft_train114/traces


reward:
  # C4 STAGED reward (was silently inactive: the Megatron config chain only set
  # `reward.reward_type: eqa` — the reward-WORKER class — never `reward.type`, which
  # the agent loop reads via reward_cfg.get("type", "terminal"). So the first G2 run
  # used pure terminal {-0.5 no-submit, 0.0 wrong, 1.0 correct}; under sampling the
  # cautious cold-start almost never submits, so every sample in a group floored at
  # -0.5 -> zero advantage variance -> flat curve. Staged credits per-turn coverage
  # gain + new objects + relevant inspect (from meta=episode.traj_info()), so
  # budget-exhaust trajectories earn graded reward by exploration -> restores
  # within-group variance for GRPO. Terminal stays dominant (|±1.0| >> shaping).
  type: staged


rollout:
  model:
    # Init from the v5 SFT cold-start (HF export of global_step_80; loss 0.58->0.018,
    # 22 epochs; behavioral eval 13/15 acc, 14/15 submit, 100% valid tool calls — see
    # code-doc/logs/sft_eval_v5_step80). Both the SGLang rollout and the on-the-fly
    # HF->Megatron actor conversion read ${rollout.model.model_path}.
    model_path: /data/hm_eqa/sft_runs/train114_hf_v5_step80

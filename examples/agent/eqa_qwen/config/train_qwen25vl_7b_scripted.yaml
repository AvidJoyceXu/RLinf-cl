# M2 scripted-policy smoke: emit canned <tool_call> tokens (no LLM, no training).
# Bypasses self.generate() so the actor / rollout / inference groups never run.
# Goal: prove the agent loop + tool worker + Habitat episode handle wire up.
# See code-doc/0514 - RLinf agentic RL pipeline implementation.md §6.3.
#
# Hardware profile: 8x NVIDIA H20-3e (140 GB each). No memory workarounds needed.
defaults:
  - train_qwen25vl_7b


runner:
  experiment_name: eqa-m2-scripted-smoke
  max_epochs: 1
  max_steps: 1
  val_check_interval: 1
  save_interval: 1


algorithm:
  # validate_cfg requires group_size > 1; keep minimal for smoke.
  group_size: 2
  # No reference policy needed for a scripted smoke run.
  kl_beta: 0.0
  # recompute_logprobs: True (inherited) — run_inference recomputes logprobs via
  # FSDP after rollout so DynamicRolloutResult.prompt_ids/response_ids are used.

actor:
  # DP load-balance assertion uses total_batch_size_per_dp (trajectory count) but
  # batch["input_ids"].shape[0] is turn count; disable for multi-turn smoke.
  enable_dp_load_balance: False


data:
  # rollout_batch_size * group_size / n_minibatches = global_batch_size;
  # global_batch_size must be divisible by actor_world_size (8 on H20 node).
  # 8 * 2 / 2 = 8, divisible by 8.
  rollout_batch_size: 8
  train_data_paths: ["/data/hm_eqa/m2_smoke.jsonl"]
  max_prompt_length: 512


agentloop:
  scripted_policy: True
  max_turns: 2

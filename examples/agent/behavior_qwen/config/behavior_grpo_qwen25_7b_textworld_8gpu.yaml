# Eight-GPU placement for the frozen 48/12 TextWorld GRPO contract.
# Qwen2.5-7B has 28 attention heads, so eight physical GPUs use TP4 x DP2.
# Keep experiment semantics in the parent; this file changes only placement.
defaults:
  - behavior_grpo_qwen25_7b_textworld
  - _self_

runner:
  experiment_name: behavior-grpo-textworld-tp8

cluster:
  component_placement:
    actor,rollout,reward: 0-7

rollout:
  gpu_memory_utilization: 0.35
  tensor_parallel_size: 4

actor:
  model:
    tensor_model_parallel_size: 4

inference:
  model:
    tensor_model_parallel_size: 4

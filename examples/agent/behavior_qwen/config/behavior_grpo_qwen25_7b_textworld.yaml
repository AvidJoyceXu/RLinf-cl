# Online trajectory-return GRPO on BEHAVIOR-TextWorld -- symbolic benchmark, 1 GPU.
#
# Same policy and semantic/viewpoint tools as
# `behavior_grpo_qwen25_7b_megatron.yaml`. The one thing that differs is the
# environment: `tools.behavior.backend: textworld` swaps OmniGibson for the symbolic
# BDDL dynamics layer (rlinf/envs/behavior/symbolic_world.py).
#
# WHY THIS CONFIG EXISTS. The geometric backend has ground-truth poses only for
# scene reset and for the pairs on the EXPERT's trajectory; `_place` refuses any
# (movable, target) outside that cache, so an off-plan placement cannot be scored
# and exploration is confined to the expert's plan. The symbolic layer has a defined
# outcome for every (tool, object) pair, which is what makes RL exploration
# meaningful. It is a different, coarser task -- see the fidelity gaps in
# symbolic_world.py -- not a drop-in substitute for the geometric numbers.
#
# WHAT THE ENVIRONMENT CHANGE BUYS, and it drives most of the settings below:
#   * reset ~1 ms and a tool call ~50 us, vs 0.5-1.3 s and ~13 ms. Rollout cost is
#     now entirely LLM decode, so `group_size` is a memory question, not a time one.
#   * no Kit, so no one-activity-per-process lock: ONE worker rank hosts all 48
#     activities and `tools.behavior.activity` is left unset.
#   * S2 is the frozen activity-disjoint 12-row scan subset. Every row stays in
#     the denominator and carries its exact source, geometry key, and oracle budget.
#
# WHAT IT COSTS: no instance variety. BDDL ships exactly one definition per activity
# (measured 1016/1016), so each activity has ONE start state and within-group
# variance comes from sampling temperature alone.
#
# The first baseline intentionally starts from pinned base weights and bypasses the
# rejected primitive-tour SFT. A future scan-SFT initialization is a separate arm.
#
#   python examples/agent/behavior_qwen/train.py \
#     --config-path config --config-name behavior_grpo_qwen25_7b_textworld
defaults:
  - override hydra/job_logging: stdout


hydra:
  run:
    dir: .
  output_subdir: null


cluster:
  num_nodes: 1
  component_placement:
    # `reward` is required by ModelParallelComponentPlacement's assert
    # (placement.py:135) even though train.py passes reward=None -- the agent loop
    # scores each trajectory itself from the BDDL goal status carried in the tool
    # responses. The entry reserves a placement that is never instantiated.
    actor,rollout,reward: 0


runner:
  task_type: reasoning
  experiment_name: behavior-grpo-textworld
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: behavior-toolcall
    experiment_name: ${runner.experiment_name}
    # wandb records the fully resolved config, so this file IS the per-run
    # hyperparameter log. run_train.sh falls back to WANDB_MODE=offline with no key.
    logger_backends: ["tensorboard", "wandb"]
    wandb_proxy: null

  max_epochs: 1
  max_steps: -1
  # Validation is the POINT here, not an afterthought: val_s2 is 12 held-out
  # activities and an eval pass costs no simulator time.
  val_check_interval: 10
  save_interval: 10

  # 8192, not the 16384 of the FSDP config. Megatron + on-the-fly HF->MG conversion
  # + collocated SGLang on one card is exactly the combination that OOMed during the
  # EQA bring-up. Raise this first once the loop is proven, and drop it first if it
  # OOMs.
  # 6144, dropped from 8192 after a second OOM. The config note's own advice is to
  # drop seq_length before raising gpu_memory_utilization, and activation memory
  # scales with it. max_prompt_length stays 4096 (system + 17 tool schemas + NL goal
  # is ~1.8K and grows per turn), leaving 2048 for generation -- ample at 512
  # max_new_tokens per turn.
  seq_length: 6144

  # The Megatron MA path handles ragged batches via get_batch_pad + pack_traj_batch
  # and does NOT use the FSDP dynamic-pack path. Leave the global flag off;
  # `actor.pack_traj` drives Megatron packing.
  enable_dynamic_batch_size: False
  max_tokens_per_mbs: 11008

  resume_dir: null
  output_dir: /data/behavior-data/rl_runs


algorithm:
  # 8, not 2. On OmniGibson a group's samples ran sequentially behind the single
  # scene, each paying a reset, so group_size was a wall-clock decision. Here a reset
  # is ~1 ms and the only cost is decode, so size the group for ADVANTAGE QUALITY:
  # with one start state per activity, sampling temperature is the sole source of
  # within-group variance and a bigger group is how that variance gets estimated.
  group_size: 8
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null

  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1

  # Tool responses are spliced into the context between turns, which re-tokenizes the
  # prefix -- rollout logprobs would not match the actor's view.
  recompute_logprobs: True
  shuffle_rollout: False

  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.001                 # real run: keep the cold start from drifting
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: False
  clip_ratio_c: null
  clip_ratio_low: null
  clip_ratio_high: null

  # `grpo_dynamic` handles ragged multi-turn trajectories. In `trajectory` mode the
  # trajectory return is broadcast to its turns; `turn_level` below changes weighting
  # but is NOT causal per-step credit. Only MAMegatronActor implements this path.
  adv_type: grpo_dynamic
  loss_scales: ["group_level", "agent_level", "turn_level"]
  advantage_mode: trajectory
  normalize_advantages: False
  early_stop_imp_ratio: 5.0
  use_valid_token_scale: False

  sampling_params:
    do_sample: True
    # Temperature 1.0 is the main variance knob: without it every sample in a group
    # succeeds or fails together and the GRPO advantage is identically zero (0717 §5).
    temperature: 1.0
    top_k: 1000000
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 512
    min_new_tokens: 1
    stop: ["</tool_call>", "<|im_end|>"]


data:
  type: math                     # generic JSONL prompt/answer loader
  max_prompt_length: 4096        # system + 17 tool schemas + NL goal ~1.8K, grows per turn
  filter_prompt_by_length: True
  # global_batch_size = rollout_batch_size * group_size / n_minibatches = 2*8/1 = 16
  rollout_batch_size: 2
  # One held-out activity per validation batch keeps 8 sampled trajectories within
  # the rollout server's concurrency/memory envelope. The runner now honors this
  # value instead of replacing every non-null value with the full dataset size.
  val_rollout_batch_size: 1
  num_workers: 2
  prompt_key: prompt
  answer_key: solutions          # carries the episode spec, not an answer
  apply_chat_template: False
  shuffle: True
  validation_shuffle: False
  seed: 1234
  # Frozen T2b public-scan rows only: 48 train and 12 activity-disjoint S2.
  train_data_paths: ["/data/behavior-data/text_detect_scan_v5/rl/train.jsonl"]
  val_data_paths: ["/data/behavior-data/text_detect_scan_v5/rl/val_s2.jsonl"]


agentloop:
  group_name: "AgentLoopGroup"
  toolcall_parser: "eqa-qwen"    # format-level Qwen <tool_call> parser, not EQA-specific
  # Compatibility fallback only. Frozen detect rows carry oracle_turns and budget_k
  # below is authoritative; missing oracle metadata fails closed.
  max_turns: 30
  max_tool_response_length: 3000 # observe() returns up to ~2.5K chars
  tool_response_truncate_side: "right"
  print_outputs: False
  is_dynamic_rollout_batch: True
  obs_mode: detect_scope_scan
  selection_mode: handle
  # K is an evaluation/training axis, not a hidden flat ceiling. Each dataset row
  # carries its certified oracle turn count; override K explicitly for K=1/3 curves.
  budget_k: 2.0
  budget_cap: null
  max_nudges: 3
  # nl -> the goal arrives as an English sentence rendered from the UNGROUND BDDL.
  # With ground atoms the policy transliterates inside(a,b) into place_inside(a,b)
  # and never plans.
  goal_format: nl
  # Base Qwen was pretrained on assistant/tool role boundaries. The historical
  # flat JSON continuation is available only for checkpoints trained on that old
  # SFT serialization; using it from base weights causes every second turn to EOS.
  context_format: native
  trace_dump_dir: ${runner.output_dir}/${runner.experiment_name}/traces


tools:
  behavior:
    # THE ONE KEY THAT MAKES THIS THE SYMBOLIC BENCHMARK.
    backend: textworld
    obs_mode: detect_scope_scan
    selection_mode: handle
    # Deliberately unset. On OmniGibson this had to be known at construction time so
    # Kit could boot on the main thread; with no Kit the worker builds a symbolic
    # world per activity on demand and caches it, so one rank serves all 703.
    activity: null
    # The frozen 48/12 subset is entirely v3.9.1. 2025 and local-v3.7 must not enter
    # this run; session_start validates source and exact geometry basename per row.
    instance_sources: 2026-v3.9.1
    # The remaining OmniGibson keys are geometry-loading knobs with nothing to load.
    # BehaviorTextWorld accepts and ignores them so one config block drives either
    # backend; they are left here as an explicit record of what does NOT apply.
    instances_per_activity: 0
    rgb: False
    partial_scene: True

reward:
  group_name: "RewardGroup"
  # No reward worker: the agent loop scores each trajectory from the real BDDL
  # goal_status the tool responses carry.
  use_reward_model: False
  reward_scale: 1.0
  type: staged
  shaping:
    success_reward: 1.0
    no_end_penalty: -0.5
    # Archived v1 gave an unsuccessful end_task terminal=0, so abandoning the
    # task (-0.02 after refusal) beat every budget-exhausted partial trajectory
    # (at most -0.20). Put both unsuccessful endpoints on the same failure floor;
    # net coverage then makes valid partial progress rank above zero-progress stop.
    premature_end_penalty: -0.5
    coverage_weight: 0.3
    format_penalty: -0.05
    refusal_penalty: -0.02


rollout:
  group_name: "RolloutGroup"
  # SGLang otherwise chooses an unrecorded random engine seed at startup. Rank
  # offset avoids identical streams across the two rollout-DP engines.
  seed: 1234
  # 0.35, not 0.5. This is a fraction of TOTAL GPU memory, not free memory, so 0.5
  # reserves ~72 GB of the H20's 143 GB and leaves ~42 GB -- against a Megatron actor
  # that needs ~43 GB (28.37 GB DDP grad buffer for 7.6B params + ~15 GB bf16
  # weights). That is under water before any co-tenant appears, and this host is
  # shared: a neighbour's job briefly took 67 GB and produced
  #     torch.OutOfMemoryError: Tried to allocate 28.37 GiB ... 10.21 GiB is free
  # 0.35 -> ~50 GB for SGLang, ~64 GB for the actor. Raise it once the loop is proven
  # and the machine is quiet; drop seq_length before raising this if it OOMs again.
  gpu_memory_utilization: 0.22
  model:
    # Direct-RL baseline from the pinned base model. The old matched SFT imitates
    # hidden-geometry primitive tours and is intentionally not used here.
    model_path: /data/hf_home/Qwen2.5-7B-Instruct
    model_type: qwen2.5
    precision: ${actor.model.precision}
  enforce_eager: False
  distributed_executor_backend: mp
  disable_log_stats: False
  detokenize: True
  padding: null
  eos: null
  return_logprobs: ${not:${algorithm.recompute_logprobs}}

  rollout_backend: sglang
  sglang:
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: False
    torch_compile_max_bs: 128
  vllm:
    attention_backend: FLASH_ATTN
    enable_chunked_prefill: True
    enable_prefix_caching: True
    enable_flash_infer_sampler: True
    max_num_batched_tokens: null
    torch_profiler_dir: null

  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_running_requests: 64
  cuda_graph_max_bs: 64

  validate_weight_first_sync: True
  validate_weight: False
  validate_save_dir: null
  print_outputs: False


actor:
  group_name: "ActorGroup"
  training_backend: megatron     # selects MAMegatronActor in train.py
  enable_dp_load_balance: True
  calculate_flops: False
  # Required acceptance evidence: sample the same dense tensor immediately before
  # and after optimizer.step. On resume, the prior after fingerprint must equal the
  # next before fingerprint, and every accepted update must change sampled values.
  log_parameter_probe: True
  parameter_probe_samples: 4096
  seed: 1234

  pack_traj: True                # drives Megatron ragged packing
  mcore_gpt: True
  spec_name: decoder_gpt

  # Swap optimizer/params/grads to CPU while SGLang holds the GPU.
  offload_optimizer: True
  offload_weight: True
  offload_grad: True

  global_batch_size: 4
  micro_batch_size: 1

  model:
    precision: bf16

    # TE 2.5 otherwise prefers cuDNN fused attention on Hopper+ even when its
    # supported flash-attn is installed. cuDNN 9.10.2 has no valid sm_120 engine
    # for this packed-thd backward, so make the working backend an explicit part
    # of the training contract rather than relying on TE's hardware heuristic.
    attention_backend: flash

    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}

    megatron_checkpoint: null    # converted at startup from HF

    # Qwen2.5-7B megatron model config
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: False
    position_embedding_type: rope

    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: False

    # Full activation recompute over all 28 layers to fit one card.
    recompute_method: block
    recompute_granularity: full
    recompute_num_layers: 28

    apply_rope_fusion: True
    bias_dropout_fusion: False
    persist_layer_norm: False
    bias_activation_fusion: False
    attention_softmax_in_fp32: True
    batch_p2p_comm: False
    variable_seq_lengths: True
    gradient_accumulation_fusion: False
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: False

  optim:
    optimizer: adam
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    min_lr: 0.0
    weight_decay: 0.01
    clip_grad: 0.8

    use_distributed_optimizer: True
    overlap_grad_reduce: False
    overlap_param_gather: False
    optimizer_enable_pin: False
    overlap_param_gather_with_optimizer_step: False

    bf16: True                   # Qwen native; no grad scale needed
    fp16: False

  lr_sched:
    # Constant-LR baseline: a nonzero warmup fraction overrides
    # `lr_warmup_iters: 0` in Megatron and silently shrinks the first updates.
    # That already invalidated one SFT launch and made the first GRPO diagnostic
    # step run at 1/50 of its declared rate.
    lr_warmup_fraction: 0.0
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 1000

  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: False
    trust_remote_code: True
    padding_side: 'right'

  megatron:
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: False
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    # Convert the HF snapshot to Megatron at startup -- no separate Megatron ckpt
    # is needed, and Qwen2.5-7B is in the convertor's supported list.
    use_hf_ckpt: True
    use_profiler: False

    ckpt_convertor:
      model: Qwen2.5-7B
      hf_model_path: ${rollout.model.model_path}
      save_path: ${runner.output_dir}/${runner.experiment_name}/converted_ckpts/actor
      use_gpu_num: 0
      use_gpu_index: null
      process_num: 16
      tensor_model_parallel_size: ${actor.model.tensor_model_parallel_size}
      pipeline_model_parallel_size: ${actor.model.pipeline_model_parallel_size}


inference:
  model_type: ${rollout.model.model_type}
  group_name: "InferenceGroup"
  load_from_actor: True
  model:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1

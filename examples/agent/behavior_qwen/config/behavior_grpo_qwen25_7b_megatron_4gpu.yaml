# Turn-level online GRPO for the BEHAVIOR semantic-tool planner, 4 GPUs (TP=4).
#
# WHY THIS EXISTS. The 1-GPU variant needs ~91-107 GB for a 7B actor collocated with
# SGLang (measured; see 0731 doc §2). zp-nc81 is SHARED and co-tenant usage swung
# 25 GB -> 128 GB per card within one session, so the single-GPU run OOMed twice --
# once in Megatron's DDP setup (28.37 GB grad buffer) and once on a 518 MiB request
# with 266 MiB free. Sharding across 4 cards divides weights, gradients and the KV
# pool, bringing per-GPU need to roughly a quarter.
#
# Pick the 4 emptiest GPUs before launching -- `nvidia-smi --query-gpu=index,memory.used
# --format=csv` -- and set component_placement accordingly. TP requires CONTIGUOUS
# ranks (placement.py asserts it), so reorder with CUDA_VISIBLE_DEVICES if the free
# cards are not adjacent.
#
# WHY MEGATRON AND NOT FSDP. The FSDP actor has no multi-agent multi-turn path:
# `RolloutResult.split_results` asserts `num_sequence % (group_size * split_num) == 0`,
# which variable-turn rollouts violate by construction. Our episodes ARE variable-turn
# (expert 12.6 mean / 66 max; policy capped at 30), so FSDP is not merely slower here,
# it is wrong. `MAMegatronActor` (selected by train.py when
# `actor.training_backend == megatron`) has a purpose-built ragged multi-turn split
# (`DynamicRolloutResult.split_results` by per-group turn counts) plus loss scales over
# group / agent / turn. There is no MA FSDP actor in the tree -- `ma_megatron_actor_worker.py`
# is the only one. Every agentic example upstream ships (searchr1, wideseek_r1, rstar2,
# coding_online_rl) uses megatron for the same reason.
#
# THE TURN-LEVEL BIT IS THE POINT, not an optimisation:
#     adv_type: grpo_dynamic
#     loss_scales: ["group_level", "agent_level", "turn_level"]
# Plain `grpo` + trajectory advantage gives one scalar per episode, so a 30-turn
# trajectory that succeeds credits every turn equally -- including the wasted ones.
# `turn_level` is what makes per-turn credit assignment possible at all.
#
# Self-contained on purpose (mirrors the EQA megatron config, which mirrors searchr1)
# rather than inheriting the FSDP chain, so FSDP-shaped actor keys cannot leak into
# the Megatron actor block.
#
# BASE WEIGHTS, not the SFT cold start: this run is for debugging the pipeline.
# Expect success_rate 0 and near-zero within-group variance -- an un-cold-started
# policy rarely emits well-formed tool calls. That is a valid plumbing test and NOT a
# result. A learning run must init from the SFT export (0717).
#
#   python examples/agent/behavior_qwen/train.py \
#     --config-path config --config-name behavior_grpo_qwen25_7b_megatron
defaults:
  - override hydra/job_logging: stdout


hydra:
  run:
    dir: .
  output_subdir: null


cluster:
  num_nodes: 1
  component_placement:
    # `reward` is required by ModelParallelComponentPlacement's assert
    # (placement.py:135) even though train.py passes reward=None -- the agent loop
    # scores each trajectory itself from the BDDL goal status carried in the tool
    # responses. The entry reserves a placement that is never instantiated.
    # 4 contiguous GPUs. Adjust to whichever four are emptiest.
    actor,rollout,reward: 0-3


runner:
  task_type: reasoning
  experiment_name: behavior-grpo-4gpu-megatron
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: behavior-toolcall
    experiment_name: ${runner.experiment_name}
    # wandb records the fully resolved config, so this file IS the per-run
    # hyperparameter log. run_train.sh falls back to WANDB_MODE=offline with no key.
    logger_backends: ["tensorboard", "wandb"]
    wandb_proxy: null

  max_epochs: 1
  max_steps: 2                   # smoke: prove the loop closes, not learn
  val_check_interval: 100        # > max_steps => validation never fires
  save_interval: 100

  # 8192, not the 16384 of the FSDP config. Megatron + on-the-fly HF->MG conversion
  # + collocated SGLang on one card is exactly the combination that OOMed during the
  # EQA bring-up. Raise this first once the loop is proven, and drop it first if it
  # OOMs.
  # 6144, dropped from 8192 after a second OOM. The config note's own advice is to
  # drop seq_length before raising gpu_memory_utilization, and activation memory
  # scales with it. max_prompt_length stays 4096 (system + 17 tool schemas + NL goal
  # is ~1.8K and grows per turn), leaving 2048 for generation -- ample at 512
  # max_new_tokens per turn.
  seq_length: 8192

  # The Megatron MA path handles ragged batches via get_batch_pad + pack_traj_batch
  # and does NOT use the FSDP dynamic-pack path. Leave the global flag off;
  # `actor.pack_traj` drives Megatron packing.
  enable_dynamic_batch_size: False
  max_tokens_per_mbs: 11008

  resume_dir: null
  output_dir: /data/behavior-data/rl_runs


algorithm:
  # One instance per group: OmniGibson serves one session at a time per process, so a
  # group's samples run sequentially in this rank. Each costs a 0.5s warm reset.
  group_size: 2
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null

  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1

  # Tool responses are spliced into the context between turns, which re-tokenizes the
  # prefix -- rollout logprobs would not match the actor's view.
  recompute_logprobs: True
  shuffle_rollout: False

  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0                   # no reference policy for the smoke
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  entropy_bonus: 0.0
  calculate_entropy: False
  clip_ratio_c: null
  clip_ratio_low: null
  clip_ratio_high: null

  # THE turn-level setting. `grpo_dynamic` is the ragged multi-turn advantage;
  # loss_scales distributes credit across group / agent / turn. Only MAMegatronActor
  # implements this path.
  adv_type: grpo_dynamic
  loss_scales: ["group_level", "agent_level", "turn_level"]
  advantage_mode: trajectory
  normalize_advantages: False
  early_stop_imp_ratio: 5.0
  use_valid_token_scale: False

  sampling_params:
    do_sample: True
    # Temperature 1.0 is the main variance knob: without it every sample in a group
    # succeeds or fails together and the GRPO advantage is identically zero (0717 §5).
    temperature: 1.0
    top_k: 1000000
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 512
    min_new_tokens: 1
    stop: ["</tool_call>", "<|im_end|>"]


data:
  type: math                     # generic JSONL prompt/answer loader
  max_prompt_length: 4096        # system + 17 tool schemas + NL goal ~1.8K, grows per turn
  filter_prompt_by_length: True
  # global_batch_size = rollout_batch_size * group_size / n_minibatches = 2*2/1 = 4
  rollout_batch_size: 2
  val_rollout_batch_size: null
  num_workers: 2
  prompt_key: prompt
  answer_key: solutions          # carries the episode spec, not an answer
  apply_chat_template: False
  shuffle: True
  validation_shuffle: False
  seed: 1234
  # ONE activity: OmniGibson locks the activity at first boot, so a worker that booted
  # picking_up_trash refuses anything else. With the 22-activity split every rollout
  # after the first fails on activity_mismatch.
  train_data_paths: ["/data/behavior-data/rl/train_1activity.jsonl"]
  val_data_paths: ["/data/behavior-data/rl/train_1activity.jsonl"]


agentloop:
  group_name: "AgentLoopGroup"
  toolcall_parser: "eqa-qwen"    # format-level Qwen <tool_call> parser, not EQA-specific
  max_turns: 20
  max_tool_response_length: 3000 # observe() returns up to ~2.5K chars
  tool_response_truncate_side: "right"
  print_outputs: True
  is_dynamic_rollout_batch: True
  obs_mode: full
  # nl -> the goal arrives as an English sentence rendered from the UNGROUND BDDL.
  # With ground atoms the policy transliterates inside(a,b) into place_inside(a,b)
  # and never plans.
  goal_format: nl
  trace_dump_dir: ${runner.output_dir}/${runner.experiment_name}/traces


tools:
  behavior:
    # In-process OmniGibson; no env-server pool, no HTTP.
    # Known at CONSTRUCTION time so the worker can boot Kit on the actor's MAIN
    # thread. Booting on an asyncio.to_thread worker does not work: Kit assumes the
    # main thread in at least three places, and the third (its `Loop` object being
    # poked by asyncio-shaped code) produces a per-frame traceback storm that turned
    # a 5:59 boot into >28 min. Not a real constraint -- OmniGibson locks one
    # activity per process anyway, so this states what was already true.
    activity: picking_up_trash
    obs_mode: full
    # 0 = keep ALL discovered instances. This must not truncate: build_rl_dataset
    # samples arbitrary instance ids (59, 97, 124, ... for picking_up_trash) while
    # `instances_per_activity: N` keeps only the first N (ids 0..N-1), so every
    # session_start raised KeyError. The list is only file metadata -- the sim loads
    # one instance at a time -- so keeping all 351 costs nothing.
    instances_per_activity: 0
    rgb: False                   # the semantic ACI reads no pixels
    partial_scene: True          # load_task_relevant_only -> 122 objects, 0.1s reset


reward:
  group_name: "RewardGroup"
  # No reward worker: the agent loop scores each trajectory from the real BDDL
  # goal_status the tool responses carry.
  use_reward_model: False
  reward_scale: 1.0
  type: staged
  shaping:
    success_reward: 1.0
    no_end_penalty: -0.5
    coverage_weight: 0.3


rollout:
  group_name: "RolloutGroup"
  # 0.35, not 0.5. This is a fraction of TOTAL GPU memory, not free memory, so 0.5
  # reserves ~72 GB of the H20's 143 GB and leaves ~42 GB -- against a Megatron actor
  # that needs ~43 GB (28.37 GB DDP grad buffer for 7.6B params + ~15 GB bf16
  # weights). That is under water before any co-tenant appears, and this host is
  # shared: a neighbour's job briefly took 67 GB and produced
  #     torch.OutOfMemoryError: Tried to allocate 28.37 GiB ... 10.21 GiB is free
  # 0.35 -> ~50 GB for SGLang, ~64 GB for the actor. Raise it once the loop is proven
  # and the machine is quiet; drop seq_length before raising this if it OOMs again.
  # Back up from the 1-GPU value: with TP=4 the actor's per-card footprint is ~quarter,
  # so SGLang can have a larger fraction of each card. Still conservative for a shared
  # host -- raise once you have a quiet window.
  gpu_memory_utilization: 0.30
  model:
    # BASE instruct weights (see header). Container path; the host HF cache is
    # mounted at /data/hf_home. Converted to Megatron on the fly by ckpt_convertor.
    model_path: /data/hf_home/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28
    model_type: qwen2.5
    precision: ${actor.model.precision}
  enforce_eager: False
  distributed_executor_backend: mp
  disable_log_stats: False
  detokenize: True
  padding: null
  eos: null
  return_logprobs: ${not:${algorithm.recompute_logprobs}}

  rollout_backend: sglang
  sglang:
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: False
    torch_compile_max_bs: 128
  vllm:
    attention_backend: FLASH_ATTN
    enable_chunked_prefill: True
    enable_prefix_caching: True
    enable_flash_infer_sampler: True
    max_num_batched_tokens: null
    torch_profiler_dir: null

  # SGLang shards the KV cache across the same 4 cards.
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  max_running_requests: 64
  cuda_graph_max_bs: 64

  validate_weight_first_sync: True
  validate_weight: False
  validate_save_dir: null
  print_outputs: False


actor:
  group_name: "ActorGroup"
  training_backend: megatron     # selects MAMegatronActor in train.py
  enable_dp_load_balance: True
  calculate_flops: False
  seed: 1234

  pack_traj: True                # drives Megatron ragged packing
  mcore_gpt: True
  spec_name: decoder_gpt

  # Swap optimizer/params/grads to CPU while SGLang holds the GPU.
  offload_optimizer: True
  offload_weight: True
  offload_grad: True

  global_batch_size: 4
  micro_batch_size: 1

  model:
    precision: bf16

    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}

    megatron_checkpoint: null    # converted at startup from HF

    # Qwen2.5-7B megatron model config
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: False
    position_embedding_type: rope

    # TP=4: 7.6B weights (~15 GB bf16) and the 28.37 GB fp32 DDP grad buffer both
    # shard, so per-GPU actor memory drops to roughly a quarter. sequence_parallel
    # stays off -- it saves activation memory but full recompute already does that,
    # and it adds all-gathers per layer.
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    sequence_parallel: False

    # Full activation recompute over all 28 layers to fit one card.
    recompute_method: block
    recompute_granularity: full
    recompute_num_layers: 28

    apply_rope_fusion: True
    bias_dropout_fusion: False
    persist_layer_norm: False
    bias_activation_fusion: False
    attention_softmax_in_fp32: True
    batch_p2p_comm: False
    variable_seq_lengths: True
    gradient_accumulation_fusion: False
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: False

  optim:
    optimizer: adam
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    min_lr: 0.0
    weight_decay: 0.01
    clip_grad: 0.8

    use_distributed_optimizer: True
    overlap_grad_reduce: False
    overlap_param_gather: False
    optimizer_enable_pin: False
    overlap_param_gather_with_optimizer_step: False

    bf16: True                   # Qwen native; no grad scale needed
    fp16: False

  lr_sched:
    lr_warmup_fraction: 0.05
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 1000

  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: False
    trust_remote_code: True
    padding_side: 'right'

  megatron:
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 30
    ckpt_format: torch
    use_dist_ckpt: False
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    # Convert the HF snapshot to Megatron at startup -- no separate Megatron ckpt
    # is needed, and Qwen2.5-7B is in the convertor's supported list.
    use_hf_ckpt: True
    use_profiler: False

    ckpt_convertor:
      model: Qwen2.5-7B
      hf_model_path: ${rollout.model.model_path}
      save_path: ${runner.output_dir}/${runner.experiment_name}/converted_ckpts/actor
      use_gpu_num: 0
      use_gpu_index: null
      process_num: 16
      tensor_model_parallel_size: ${actor.model.tensor_model_parallel_size}
      pipeline_model_parallel_size: ${actor.model.pipeline_model_parallel_size}


inference:
  model_type: ${rollout.model.model_type}
  group_name: "InferenceGroup"
  load_from_actor: True
  model:
    tensor_model_parallel_size: ${actor.model.tensor_model_parallel_size}
    pipeline_model_parallel_size: 1

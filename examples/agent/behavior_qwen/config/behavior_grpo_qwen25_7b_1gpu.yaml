# Single-card smoke for the integrated online-GRPO loop.
#
# Purpose is to prove the loop closes end-to-end — prompt -> SGLang turn -> in-process
# tool call -> OmniGibson -> BDDL reward -> FSDP update — not to learn anything. Read
# three numbers from the first step: rollout/end_task_rate (does it terminate at all),
# rollout/goal_coverage (partial progress), rollout/success_rate.
#
# Starts from BASE Qwen2.5-7B-Instruct, not the SFT cold start, because this run is
# for debugging the pipeline. Expect success_rate 0 and near-zero within-group variance:
# an un-cold-started policy rarely emits well-formed tool calls, so GRPO has almost no
# signal. That is fine for a plumbing test and NOT a result — a learning run must init
# from the SFT export (see 0717 on why variance needs the cold start).
defaults:
  - behavior_grpo_qwen25_7b


cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0


runner:
  experiment_name: behavior-grpo-1gpu-smoke
  max_steps: 2
  val_check_interval: 100        # skip validation during the smoke
  save_interval: 100
  # Dynamic batch packing assumes the left-padded RolloutResult layout while the
  # agent loop produces right-padded DynamicRolloutResult, so pack indices land in
  # pad regions and the actor's backward trips an illegal memory access. Same
  # constraint as the EQA 1-GPU config.
  enable_dynamic_batch_size: False


algorithm:
  # OmniGibson serves one session at a time per process, so a group's samples run
  # sequentially in one worker rank regardless of this number. Keep it small: each
  # sample costs a full episode reset.
  group_size: 2


data:
  rollout_batch_size: 2
  # ONE activity only. OmniGibson locks the activity at first boot, so a worker that
  # booted picking_up_trash refuses anything else -- with the 22-activity train split
  # every rollout after the first would fail on activity_mismatch. Built by filtering
  # rl/train.jsonl; see the run log.
  train_data_paths: ["/data/behavior-data/rl/train_1activity.jsonl"]
  # Validation would hit the same wall (val_s2 spans 3 activities), but
  # val_check_interval: 100 > max_steps: 2 means it never fires in the smoke.
  val_data_paths: ["/data/behavior-data/rl/train_1activity.jsonl"]


actor:
  # global_batch_size = rollout_batch_size * group_size / n_minibatches = 2*2/2 = 2
  global_batch_size: 2
  enable_offload: True           # swap the optimizer out while SGLang holds the GPU


rollout:
  gpu_memory_utilization: 0.5    # leave room for FSDP weights+grads+optimizer
  model:
    # BASE instruct weights, not the SFT export — see the header. Container path;
    # the host HF cache is mounted at /data/hf_home. actor.model.model_path and
    # tokenizer_model both reference ${rollout.model.model_path}, so this one key
    # moves all three.
    model_path: /data/hf_home/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28


agentloop:
  max_turns: 20
  print_outputs: True

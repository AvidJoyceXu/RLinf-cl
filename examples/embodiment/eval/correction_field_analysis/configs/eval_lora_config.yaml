# Evaluation Config for Correction Vector Field Analysis
# This config is used for analyzing LoRA residual policy correction vector fields

defaults:
  - env/libero_spatial_task0@env.train
  - env/libero_spatial_task0@env.eval
  - model/lora_residual_policy@actor.model
  - model/openvla_oft@actor.base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

runner:
  # Default checkpoint paths (can be overridden by command line arguments)
  eval_policy_path: ""  # Set this to your checkpoint path or use --checkpoint_i/--checkpoint_j
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "correction_field_analysis"
    logger_backends: []  # No logging for analysis

  max_epochs: 1
  max_steps: -1
  only_eval: True

algorithm:
  update_epoch: 1
  use_fixed_reset_state_ids: False
  group_size: 1
  agg_q: min
  rollout_epoch: 1
  eval_rollout_epoch: 1

residual_policy:
  enabled: True
  base_model_path: "/workspace/hf/hub/models--Haozhan72--Openvla-oft-SFT-libero-spatial-traj1/snapshots/39e5240e879c80b6cda6b3a83763dad717f5c05d"  # Path to pre-trained OpenVLA-OFT model
  res_scale: 0.05  # Scaling factor for residual action
  prog_explore: 500
  prog_explore_threshold: 100

network:
  actor_input: "obs"  # ["obs", "obs_base_action"]
  critic_input: "sum"  # ["res", "sum", "concat"]

env:
  max_trials_per_task: 1 # NOTE: only use trial 0
  group_name: "EnvGroup"
  enable_offload: False
  train:
    total_num_envs: 1  # Only need 1 env for analysis
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: ${algorithm.group_size}
    reward_coef: 5.0
    reset_gripper_open: False
  
  eval:
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    use_fixed_reset_state_ids: True
    group_size: 1
    reset_gripper_open: False
    is_eval: True

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1024
  seed: 1234
  enable_offload: False
  model:
    model_name: "lora_residual_policy"
    policy_setup: "panda-ee-dpos"
    action_dim: 7  
    num_action_chunks: 8
    precision: "bf16"
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    actor_input: ${network.actor_input}
    obs_dim: 74  # LIBERO RL obs: robot_proprio_state (39-dim) + object_to_robot_relations (35-dim) = 74-dim
  base_model:
    model_type: "openvla_oft"
    precision: ${actor.model.precision}
    model_path: "/workspace/hf/hub/models--Haozhan72--Openvla-oft-SFT-libero-spatial-traj1/snapshots/39e5240e879c80b6cda6b3a83763dad717f5c05d"
    unnorm_key: libero_spatial_no_noops
    max_prompt_length: 128
    add_q_head: False
    add_value_head: False
  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0

  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False


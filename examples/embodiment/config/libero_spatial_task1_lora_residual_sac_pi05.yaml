defaults:
  - env/libero_spatial_task0@env.train
  - env/libero_spatial_task0@env.eval
  - model/lora_residual_policy@actor.model
  - model/pi0_5@actor.base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  eval_policy_path: ""
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_task0_single_trial_lora_residual_sac_pi05"
    logger_backends: ["wandb"] # wandb, swanlab

  max_epochs: 20000
  max_steps: -1

  only_eval: False
  val_check_interval: 100
  save_interval: 1000

algorithm:
  update_epoch: 64
  use_fixed_reset_state_ids: False
  group_size: 1
  agg_q: min

  rollout_epoch: 1
  eval_rollout_epoch: 1

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01  # Soft update coefficient for target networks
  auto_entropy_tuning: True
  alpha_type: softplus
  initial_alpha: 0.01
  target_entropy: -7  # -action_dim for LIBERO: -7
  alpha_lr: 3.0e-4

  q_head_type: "default"
  critic_actor_ratio: 2

  # Replay buffer settings
  replay_buffer_capacity: 500000
  min_buffer_size: 0
  target_update_freq: 1

  # params for rollout — used by residual policy sampling and (for OpenVLA bases)
  # the autoregressive decoder. Kept identical to the OpenVLA-OFT config so the
  # residual SAC actor/replay-buffer code paths behave the same.
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling (unused by Pi0.5 base model,
  # kept for the shared rollout-worker code path)
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

# Residual Policy Configuration
# Base Model: Pi0.5 (flow-matching VLA, frozen). Provides the base action chunk.
# Residual Policy: LoRA-augmented MLP, trained via SAC.
residual_policy:
  enabled: True
  base_model_path: "/workspace/pi0-model"  # Pi0.5 SFT checkpoint (LIBERO spatial/object/goal)
  res_scale: 0  # NOTE: debug Scaling factor for residual action
  prog_explore: 500  # Progressive exploration ramp-up steps
  prog_explore_threshold: 100  # Steps to wait before turning residual on

# Network Configuration
network:
  actor_input: "obs"   # ["obs", "obs_base_action"] - Input mode for residual policy
  critic_input: "sum"  # ["res", "sum", "concat"] - Action construction mode for Q network

env:
  group_name: "EnvGroup"
  enable_offload: False  # LiberoEnv does not support offload

  # Target ratio: transitions collected : network updates ≈ 5:1
  # transitions per global step = total_num_envs * num_action_chunks * n_chunk_steps
  #                             = 32 * 5 * 2 = 320
  # n_chunk_steps = max_steps_per_rollout_epoch / num_action_chunks
  # max_steps_per_rollout_epoch (10) must be divisible by num_action_chunks (5)
  train:
    specific_reset_id: 1
    max_trials_per_task: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 10
    group_size: ${algorithm.group_size}
    reward_coef: 5.0
    reset_gripper_open: False

  eval:
    specific_reset_id: 1
    max_trials_per_task: 1
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240  # 240 / 5 = 48 chunk steps
    use_fixed_reset_state_ids: True
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  model_dir: ""
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 128
  global_batch_size: 1024
  seed: 1234
  enable_offload: False

  # Residual policy (trainable)
  model:
    model_name: "residual_policy"
    policy_setup: "panda-ee-dpos"
    action_dim: 7
    num_action_chunks: 5  # Must match actor.base_model.openpi.action_chunk

    precision: "bf16"
    add_value_head: False
    add_q_head: True
    q_head_type: "default"

    actor_input: ${network.actor_input}

    # LIBERO spatial RL obs:
    #   robot_proprio_state (39) + object_to_robot_relations (35) = 74
    obs_dim: 74

  # Base model: Pi0.5 (frozen). Overrides on top of model/pi0_5.yaml defaults.
  base_model:
    model_type: "openpi"
    model_path: "/workspace/pi0-model"
    precision: null  # openpi handles its own dtypes; leave null per pi0_5.yaml
    num_action_chunks: ${actor.model.num_action_chunks}
    action_dim: ${actor.model.action_dim}
    num_steps: 3
    add_value_head: False
    is_lora: False
    openpi:
      config_name: "pi05_libero"
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: 3
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: False
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: null

  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0

  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

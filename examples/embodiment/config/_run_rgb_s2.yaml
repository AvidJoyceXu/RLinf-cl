defaults:
  - env/libero_spatial_task0@env.train
  - env/libero_spatial_task0@env.eval
  - model/lora_residual_policy_rgb@actor.model
  - model/openvla_oft@actor.base_model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  eval_policy_path: "/workspace/RLinf/logs/20260117-15:06:53-libero_spatial_task0_lora_residual_sac_openvlaoft/libero_spatial_task0_rand_trials_lora_residual_sac_openvlaoft/checkpoints/global_step_9000/actor/huggingface_model"
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_task2_single_trial_lora_openvlaoft_rgb"
    logger_backends: ["tensorboard"]

  max_epochs: 2000
  max_steps: -1

  only_eval: False
  val_check_interval: 100
  save_interval: 500

algorithm:
  update_epoch: 64  # 每个global step更新64次
  use_fixed_reset_state_ids: False
  group_size: 1
  agg_q: min

  rollout_epoch: 1
  eval_rollout_epoch: 1

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01  # Soft update coefficient for target networks
  auto_entropy_tuning: True  # Enable automatic entropy tuning
  alpha_type: softplus
  initial_alpha: 0.01  # Initial temperature value
  target_entropy: -7  # Target entropy (-action_dim for LIBERO: -7)
  alpha_lr: 3.0e-4  # Learning rate for temperature parameter
  
  q_head_type: "default" 
  critic_actor_ratio: 2  # Update critic 2 times per actor update for better Q-value learning
  
  # Replay buffer settings
  replay_buffer_capacity: 500000  # Increased for better sample diversity and stability
  min_buffer_size: 0  # Minimum buffer size before training starts
  target_update_freq: 1  # Frequency of target network updates

  # params for rollout
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  # length argument for autoregressive sampling
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

# Residual Policy Configuration
# Base Model: OpenVLA-OFT (provides visual understanding and base policy)
# Residual Policy: MLP (fine-tunes policy in state space)
residual_policy:
  enabled: True
  base_model_path: "/workspace/hf/hub/models--Haozhan72--Openvla-oft-SFT-libero-spatial-traj1/snapshots/39e5240e879c80b6cda6b3a83763dad717f5c05d"  # Path to pre-trained OpenVLA-OFT model
  res_scale: 0.05  # Scaling factor for residual action
  prog_explore: 500 # Progressive exploration steps
  prog_explore_threshold: 100  # Threshold for progressive exploration

# Frozen visual encoder (RGB observation mode)
# Single third-person camera frame -> frozen ViT -> 384-d feature, mirroring the
# real-robot residual input. Two consecutive frames are stacked by the env and
# encoded in the rollout worker; the encoder is never trained.
visual_encoder:
  enabled: True
  model_path: "facebook/dinov2-small"
  image_size: 224
  pooling: "cls"

# Network Configuration
network: # NOTE: 和libero-sac对齐
  actor_input: "obs"  # ["obs", "obs_base_action"] - Input mode for residual policy
  critic_input: "sum"  # ["res", "sum", "concat"] - Action construction mode for Q network

env:
  group_name: "EnvGroup"
  enable_offload: False # NOTE: RuntimeError: Environment class LiberoEnv does not support offload

  # Override the default values in env/libero_spatial
  # Target: 4:1 ratio (transitions collected : network updates)
  # Calculation: transitions = total_num_envs * num_action_chunks * n_chunk_steps
  #              where n_chunk_steps = max_steps_per_rollout_epoch / num_action_chunks
  # Current config: 32 envs * 8 chunks * 1 step = 256 transitions per global step
  #                 update_epoch = 64
  #                 Ratio: 256 / 64 = 4:1 ✓
  # Note: max_steps_per_rollout_epoch must be divisible by num_action_chunks (8)
  # Alternative: For longer rollouts, use total_num_envs=64, max_steps_per_rollout_epoch=16, update_epoch=256
  train:
    specific_reset_id: 2
    obs_mode: "rgb"
    max_trials_per_task: 1
    total_num_envs: 32 # Adjusted to achieve 4:1 ratio (256 transitions per global step)
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 240  # max episode steps for truncation
    max_steps_per_rollout_epoch: 16  # NOTE: n_chunk_steps = max_steps_per_rollout_epoch / num_action_chunks
    group_size: ${algorithm.group_size}
    reward_coef: 5.0
    reset_gripper_open: False
  
  eval:
    specific_reset_id: 2
    obs_mode: "rgb"
    max_trials_per_task: 1
    total_num_envs: 32 # Increased for more comprehensive evaluation (must be divisible by env_world_size)
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    use_fixed_reset_state_ids: True
    group_size: 1
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  model_dir: ""
  enable_offload: False  # Enabled to save GPU memory for environments (32 envs need ~17G)
  pipeline_stage_num: 1

  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  # Aligned with target config: batch_size=256 per update
  micro_batch_size: 64 # unified with libero_object across all 10 RGB runs
  global_batch_size: 1024  # Aligned with target batch_size=256
  seed: 1234
  enable_offload: False  # Disabled for better performance with FSDP full_shard
  model:
    model_name: "residual_policy"
    policy_setup: "panda-ee-dpos"  # Reference only, actual obs_dim/action_dim come from config
    action_dim: 7  
    num_action_chunks: 8
    
    precision: "bf16"
    add_value_head: False
    add_q_head: True
    q_head_type: "default" 
    
    # Residual policy specific config
    actor_input: ${network.actor_input}  # Pass through from network config
    
    # LIBERO observation dimension
    # LIBERO RL obs: robot_proprio_state (39-dim) + object_to_robot_relations (35-dim) = 74-dim
    obs_dim: 846 # RGB obs: 2 x 384 frozen-ViT features + 2 x 39 robot0_proprio-state
  base_model:
    model_type: "openvla_oft"
    precision: ${actor.model.precision}
    model_path: "/workspace/hf/hub/models--Haozhan72--Openvla-oft-SFT-libero-spatial-traj1/snapshots/39e5240e879c80b6cda6b3a83763dad717f5c05d"
    unnorm_key: libero_spatial_no_noops
    max_prompt_length: 128
    add_q_head: False
    add_value_head: False
  optim:
    lr: 3.0e-4  # Lower learning rate for SAC
    value_lr: 3.0e-4  # Q-network learning rate
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False


# EQA tool-call SFT cold-start config.
#
# Trains Qwen2.5-VL-7B (text-only at Phase 1) to emit the EQA tool-call ACI in
# the rollout's flat-continuation format, on heuristic expert trajectories built
# by spatialcode/scripts/build_sft_dataset.py.
#
# Build data first:
#   python spatialcode/scripts/build_sft_dataset.py \
#     --input /data/hm_eqa/<split>.jsonl \
#     --output /data/hm_eqa/sft/expert.jsonl
# then point data.train_data_paths / tool_schemas_path below at the outputs.
#
# Run:
#   bash examples/sft/run_vlm_sft.sh eqa_sft_qwen25vl_7b
#
# Backbone matches the GRPO rollout (text Qwen2.5-7B-Instruct, model_type qwen2.5),
# so the SFT checkpoint hands off directly. The SFT worker's model loader
# auto-selects AutoModelForCausalLM for this text config; FSDPVlmSftWorker's
# model-type allowlist was widened to include qwen2.5 (see that file). See
# code-doc/0607 §5.
defaults:
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: all

runner:
  task_type: sft
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends: ["tensorboard"]

  seq_length: 8192
  max_epochs: -1
  max_steps: 2000
  val_check_interval: 500
  save_interval: 500
  experiment_name: eqa_toolcall_sft
  output_dir: ../results
  resume_dir: null

data:
  type: vlm
  dataset_name: "eqa_toolcall"     # -> EqaToolCallSftDataset (rlinf/data/datasets/vlm.py)
  apply_chat_template: True
  use_chat_template: True
  # Trajectory JSONL + the tool-schema sidecar written next to it by the builder.
  train_data_paths: "/data/hm_eqa/sft/expert.jsonl"
  val_data_paths: "/data/hm_eqa/sft/expert_val.jsonl"
  tool_schemas_path: "/data/hm_eqa/sft/expert.jsonl.tools.json"
  # Unused by EqaToolCallSftDataset (it reads prompt_messages/tool_steps) but kept
  # for VLMBaseDataset.__init__ compatibility.
  prompt_key: "question"
  answer_key: "answer"
  image_keys: []
  max_prompt_length: 2048          # prompt (system+tools+user) budget
  max_length: 6144                 # full sequence: prompt + all turns (<= seq_length)
  lazy_loading: false
  num_workers: 8
  shuffle: True
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  eval_batch_size: 1
  global_batch_size: 64
  seed: 42

  model:
    # Text backbone, same as the GRPO rollout. Loader auto-picks CausalLM.
    model_type: "qwen2.5"
    precision: fp32
    model_path: "/opt/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28"
    is_lora: False

  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    lr_scheduler: "cosine"
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 100

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
